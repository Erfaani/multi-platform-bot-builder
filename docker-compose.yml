name: botbuilder

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  env_file: [.env]
  volumes:
    - ./backend:/app
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    # Official pgvector build of PostgreSQL 16 — avoids compiling the extension
    # ourselves and keeps it patched upstream. Extensions are created by the
    # init script on first start.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botbuilder}
      POSTGRES_USER: ${POSTGRES_USER:-botbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botbuilder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    # Host port is configurable: a locally installed PostgreSQL on 5432 will
    # otherwise shadow this container and produce confusing auth failures.
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botbuilder} -d ${POSTGRES_DB:-botbuilder}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend-base
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["8000:8000"]

  # Separate queues per platform so they can later be scheduled onto hosts with
  # different network egress. See docs/00-ANALYSIS.md R-03.
  worker-default:
    <<: *backend-base
    command: ["celery", "-A", "config.celery_app", "worker", "-Q", "default", "-l", "info", "--concurrency", "4"]

  worker-telegram:
    <<: *backend-base
    command: ["celery", "-A", "config.celery_app", "worker", "-Q", "telegram", "-l", "info", "--concurrency", "4"]

  worker-bale:
    <<: *backend-base
    command: ["celery", "-A", "config.celery_app", "worker", "-Q", "bale", "-l", "info", "--concurrency", "4"]

  # Must remain a single replica, or scheduled reminders fire twice.
  beat:
    <<: *backend-base
    command: ["celery", "-A", "config.celery_app", "beat", "-l", "info"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file: [.env]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["3000:3000"]
    command: ["npm", "run", "dev"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
