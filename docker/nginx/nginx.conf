upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Webhook ingress is high-frequency and untrusted; keep it on its own limiter.
limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # Enable once TLS terminates here:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;

    location /webhooks/ {
        limit_req zone=webhooks burst=200 nodelay;
        client_max_body_size 1m;
        proxy_pass http://backend;
    }

    location ~ ^/(api|django-admin|static|healthz|readyz) {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
    }

    # User-uploaded media is NEVER served here — it lives in private storage
    # behind short-TTL signed URLs. See SECURITY.md §7.

    location / {
        proxy_pass http://frontend;
    }
}
